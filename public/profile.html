<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль игрока - ValhallaSMP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gh-header">
    <div class="gh-nav-left">
        <a href="index.html" class="gh-logo">☃️ ValhallaSMP <span class="gh-subpath">/ профиль</span></a>
    </div>
    <div class="gh-nav-right">
        <input type="text" id="searchInput" placeholder="Type / to search" style="margin:0; padding:5px 10px; width:180px; font-size:13px;" onkeydown="if(event.key === 'Enter') searchSite()">
        <div class="auth-panel" id="authPanel">
            <button class="login-btn" onclick="openAuthModal(true)">Sign in</button>
        </div>
    </div>
</header>

<nav class="gh-subnav">
    <a href="index.html" class="gh-tab">🏠 Главная</a>
    <a href="gallery.html" class="gh-tab">📸 Галерея</a>
    <a href="rules.html" class="gh-tab">📜 Правила</a>
</nav>

<div class="container">
    <div class="form-group" style="text-align: center;">
        <div id="avatarContainer" style="margin-bottom: 10px;">
            <span id="defaultAvatar" style="font-size: 60px;">👤</span>
            <img id="userAvatarImg" src="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; display: none; margin: 0 auto; border: 2px solid var(--accent);">
        </div>
        
        <h2 id="profileUsername" style="color: var(--accent); margin: 0 0 5px 0;">Загрузка...</h2>
        <p id="profileRoleBadge" style="font-size: 12px; font-weight: bold; margin: 0 0 5px 0;"></p>
        <p id="profileBio" style="color: var(--text-secondary); font-size: 14px; margin: 0 0 15px 0;"></p>
        
        <div id="adminPanel" style="display:none; margin-bottom: 15px; background:var(--card-bg); padding:10px; border-radius:6px; border:1px solid var(--border);">
            <p style="font-size: 12px; margin: 0 0 6px 0; color:var(--accent);">⚙️ Управление пользователем:</p>
            <div id="roleSelectWrapper" style="margin-bottom: 6px;">
                <label style="font-size:11px; color:var(--text-secondary);">Роль:</label>
                <select id="roleSelect" style="font-size: 12px; padding: 4px; margin-top:2px;">
                    <option value="user">Игрок</option>
                    <option value="moderator">Модератор</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            <label style="font-size:11px; color:var(--text-secondary);">Статус / Био:</label>
            <input type="text" id="adminBioInput" placeholder="Статус игрока..." style="margin-top:2px; margin-bottom: 6px; font-size:12px; padding:6px;">
            <button onclick="adminUpdateUser()" class="btn" style="width: auto; padding: 4px 10px; font-size: 12px;">Сохранить изменения</button>
        </div>

        <div id="editAvatarSection" style="display:none; margin-top: 15px; border-top: 1px solid var(--border); padding-top: 15px;">
            <label style="font-size: 13px; color: var(--text-secondary); display: block; text-align: left; margin-bottom: 4px;">Сменить аватарку:</label>
            <input type="file" id="newAvatarFile" accept="image/*" style="margin-bottom: 8px;">
            <button onclick="updateAvatar()" class="btn" style="width: auto; padding: 6px 14px; font-size: 13px;">Загрузить аватарку</button>
        </div>

        <div style="font-size: 13px; color: var(--text-secondary); margin-top: 10px;">
            Опубликовано постов: <b id="profilePostsCount">0</b>
        </div>
    </div>

    <h2>📸 Скриншоты игрока</h2>
    <div id="userPostsFeed">Загрузка постов...</div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content" onkeydown="if(event.key === 'Enter') submitAuth()">
        <span class="close-modal" onclick="closeAuthModal()">&times;</span>
        <h2 id="modalTitle" style="color: var(--accent); margin-top:0;">Вход</h2>
        <input type="text" id="authLoginInput" placeholder="Юзернейм или Email">
        <input type="password" id="authPassword" placeholder="Пароль">
        <button class="btn" onclick="submitAuth()">Войти</button>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUser = urlParams.get('user');

    function searchSite() {
        const query = document.getElementById('searchInput').value.trim();
        if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
    }

    async function loadProfile() {
        if (!targetUser) {
            document.getElementById('profileUsername').innerText = "Игрок не указан";
            return;
        }

        const res = await fetch(`/api/user/${encodeURIComponent(targetUser)}`);
        if (!res.ok) {
            document.getElementById('profileUsername').innerText = "Игрок не найден";
            document.getElementById('userPostsFeed').innerHTML = "<p style='color:var(--text-secondary); text-align:center;'>Такой пользователь не зарегистрирован на сервере.</p>";
            return;
        }

        const data = await res.json();
        document.getElementById('profileUsername').innerText = data.username;
        document.getElementById('profileBio').innerText = data.bio;
        document.getElementById('profilePostsCount').innerText = data.postsCount;

        const roleBadge = document.getElementById('profileRoleBadge');
        if (data.role === 'admin') {
            roleBadge.innerText = '🛡️ АДМИНИСТРАТОР';
            roleBadge.style.color = '#f85149';
        } else if (data.role === 'moderator') {
            roleBadge.innerText = '⚔️ МОДЕРАТОР';
            roleBadge.style.color = '#34d399';
        } else {
            roleBadge.innerText = '';
        }

        if (data.avatarUrl) {
            document.getElementById('defaultAvatar').style.display = 'none';
            const img = document.getElementById('userAvatarImg');
            img.src = data.avatarUrl;
            img.style.display = 'block';
        }

        const currentUser = JSON.parse(localStorage.getItem('user'));
        if (currentUser) {
            if (currentUser.username.toLowerCase() === data.username.toLowerCase()) {
                document.getElementById('editAvatarSection').style.display = 'block';
            }
            if (currentUser.role === 'admin' || currentUser.role === 'moderator') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('adminBioInput').value = data.bio;
                
                if (currentUser.role === 'admin') {
                    document.getElementById('roleSelect').value = data.role;
                } else {
                    document.getElementById('roleSelectWrapper').style.display = 'none';
                }
            }
        }

        const feed = document.getElementById('userPostsFeed');
        if (data.posts.length === 0) {
            feed.innerHTML = "<p style='color:var(--text-secondary); text-align:center;'>У этого игрока пока нет скриншотов.</p>";
            return;
        }

        feed.innerHTML = "";
        data.posts.forEach(post => {
            feed.innerHTML += `
                <div style="background:var(--box-bg); border-radius:8px; padding:15px; margin-bottom:15px; border:1px solid var(--border);">
                    <p style="margin:0 0 10px 0;">${post.caption || ''}</p>
                    <img src="${post.imageUrl}" style="width:100%; border-radius:6px; max-height:400px; object-fit:cover;">
                </div>
            `;
        });
    }

    async function adminUpdateUser() {
        const currentUser = JSON.parse(localStorage.getItem('user'));
        const newRole = currentUser.role === 'admin' ? document.getElementById('roleSelect').value : undefined;
        const newBio = document.getElementById('adminBioInput').value;

        const res = await fetch('/api/admin/update-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ adminUsername: currentUser.username, targetUsername: targetUser, newRole, newBio })
        });
        const data = await res.json();
        if (data.success) {
            alert("Данные обновлены!");
            location.reload();
        } else {
            alert(data.error);
        }
    }

    async function updateAvatar() {
        const currentUser = JSON.parse(localStorage.getItem('user'));
        const avatarFile = document.getElementById('newAvatarFile').files[0];
        if (!avatarFile) return alert("Выберите файл аватара!");

        const formData = new FormData();
        formData.append('username', currentUser.username);
        formData.append('avatar', avatarFile);

        const res = await fetch('/api/user/update-avatar', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
            currentUser.avatarUrl = data.avatarUrl;
            localStorage.setItem('user', JSON.stringify(currentUser));
            alert("Аватарка обновлена!");
            location.reload();
        } else {
            alert("Ошибка загрузки");
        }
    }

    async function submitAuth() {
        const login = document.getElementById('authLoginInput').value;
        const password = document.getElementById('authPassword').value;
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, password })
        });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('user', JSON.stringify(data));
            alert("Успешно!");
            location.reload();
        } else {
            alert(data.error);
        }
    }

    async function checkAuthUserPanel() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return;

        const res = await fetch(`/api/user/${encodeURIComponent(user.username)}`);
        const userData = res.ok ? await res.json() : { notifications: [], role: 'user', avatarUrl: '' };
        
        user.role = userData.role;
        user.avatarUrl = userData.avatarUrl;
        localStorage.setItem('user', JSON.stringify(user));

        const unreadCount = userData.notifications ? userData.notifications.length : 0;
        let notifHtml = '';
        if (unreadCount > 0) {
            userData.notifications.forEach(n => {
                notifHtml += `<div class="notif-item">🔔 ${n.text} <span style="color:var(--text-secondary); font-size:10px;">(${n.time})</span></div>`;
            });
            notifHtml += `<button onclick="clearNotifications()" class="btn" style="margin-top:8px; padding:4px; font-size:11px;">Очистить</button>`;
        } else {
            notifHtml = `<div style="font-size:12px; color:var(--text-secondary); text-align:center;">Нет новых уведомлений</div>`;
        }

        let avatarHtml = userData.avatarUrl 
            ? `<img src="${userData.avatarUrl}" style="width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid var(--accent); vertical-align:middle;">`
            : `<span style="font-size:20px; vertical-align:middle;">👤</span>`;

        const authPanel = document.getElementById('authPanel');
        if(authPanel) {
            authPanel.innerHTML = `
                <div style="position:relative; display:inline-block; margin-right: 8px;">
                    <span onclick="toggleNotifMenu()" style="cursor:pointer; font-size:16px;" title="Уведомления">🔔<span id="notifBadge" style="background:#f85149; color:white; border-radius:50%; padding:1px 5px; font-size:10px; position:absolute; top:-5px; right:-10px; display:${unreadCount>0?'inline':'none'}">${unreadCount}</span></span>
                    <div id="notifDropdown" class="notif-dropdown">${notifHtml}</div>
                </div>
                <a href="profile.html?user=${encodeURIComponent(user.username)}" style="text-decoration:none;" title="Профиль">${avatarHtml}</a>
                <button onclick="localStorage.removeItem('user'); location.reload();" style="background:#f85149; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-left:8px; font-size:12px;">Выйти</button>
            `;
        }
    }

    function toggleNotifMenu() {
        const drop = document.getElementById('notifDropdown');
        drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
    }

    async function clearNotifications() {
        const user = JSON.parse(localStorage.getItem('user'));
        await fetch('/api/user/notifications/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username })
        });
        location.reload();
    }

    checkAuthUserPanel();
    loadProfile();
</script>
</body>
</html>
