<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ValhallaSMP 26.2 - Галерея</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="gh-header">
    <div class="gh-nav-left">
        <a href="index.html" class="gh-logo">☃️ ValhallaSMP <span class="gh-subpath">/ галерея</span></a>
    </div>
    <div class="gh-nav-right">
        <input type="text" id="searchInput" placeholder="Type / to search" style="margin:0; padding:5px 10px; width:180px; font-size:13px;" onkeydown="if(event.key === 'Enter') searchSite()">
        <div class="auth-panel" id="authPanel">
            <button class="login-btn" onclick="openAuthModal(true)">Sign in</button>
        </div>
    </div>
</header>

<nav class="gh-subnav">
    <a href="index.html" class="gh-tab">🏠 Главная</a>
    <a href="gallery.html" class="gh-tab active">📸 Галерея</a>
    <a href="rules.html" class="gh-tab">📜 Правила</a>
</nav>

<div class="container">
    <header style="text-align: left; margin-bottom: 20px;">
        <h1>📸 Галерея сервера</h1>
    </header>

    <div style="margin-bottom: 20px; display: flex; gap: 8px; align-items: center;">
        <span style="font-size: 13px; color: var(--text-secondary);">Категория:</span>
        <select id="categoryFilter" onchange="loadPosts()" style="margin:0; width: 180px; padding: 6px; font-size: 13px;">
            <option value="all">Все категории</option>
            <option value="Постройки">Постройки</option>
            <option value="Фермы">Фермы</option>
            <option value="Ивенты">Ивенты</option>
            <option value="Красивые виды">Красивые виды</option>
            <option value="Разное">Разное</option>
        </select>
    </div>

    <div id="uploadSection" style="display:none;" class="form-group">
        <h3>Загрузить скриншот</h3>
        <input type="file" id="imageFile" accept="image/*">
        <select id="imageCategory" style="margin-bottom: 8px;">
            <option value="Постройки">Постройки</option>
            <option value="Фермы">Фермы</option>
            <option value="Ивенты">Ивенты</option>
            <option value="Красивые виды">Красивые виды</option>
            <option value="Разное">Разное</option>
        </select>
        <textarea id="imageCaption" placeholder="Подпись к фото..." rows="2"></textarea>
        
        <div id="progressContainer" class="progress-container">
            <div class="progress-bar-bg"><div id="progressBarFill" class="progress-bar-fill"></div></div>
            <div class="progress-actions">
                <span id="progressText">Загрузка: 0%</span>
                <button type="button" class="cancel-btn" onclick="cancelUpload()">Отмена</button>
            </div>
        </div>

        <button id="publishBtn" class="btn" onclick="uploadPost()">Опубликовать</button>
    </div>
    <p id="loginPrompt" style="color: var(--text-secondary);">Войдите в аккаунт, чтобы загружать скриншоты и комментировать.</p>

    <div id="postsFeed" style="margin-top: 20px;">Загрузка постов...</div>
</div>

<div id="authModal" class="modal">
    <div class="modal-content" onkeydown="if(event.key === 'Enter') submitAuth()">
        <span class="close-modal" onclick="closeAuthModal()">&times;</span>
        <h2 id="modalTitle" style="color: var(--accent); margin-top:0;">Вход</h2>
        <input type="text" id="authLoginInput" placeholder="Юзернейм или Email">
        <div id="usernameField" style="display: none;"><input type="text" id="authUsername" placeholder="Юзернейм (мин. 5 символов)"></div>
        <div id="emailField"><input type="email" id="authEmail" placeholder="Email"></div>
        <input type="password" id="authPassword" placeholder="Пароль">
        <button class="btn" id="modalActionBtn" onclick="submitAuth()">Войти</button>
        <div id="modalSwitchText" style="margin-top:15px; text-align:center; font-size:14px; color:var(--text-secondary); cursor:pointer;">
            Нет аккаунта? <span onclick="toggleAuthMode()" style="color:var(--accent);">Зарегистрироваться</span>
        </div>
    </div>
</div>

<div id="toast">Самолайк залог успеха</div>

<script>
    let isLoginMode = true;
    let currentXHR = null;

    function openAuthModal(login) { isLoginMode = login; document.getElementById('authModal').style.display = 'flex'; updateUI(); }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function toggleAuthMode() { isLoginMode = !isLoginMode; updateUI(); }
    
    function updateUI() {
        document.getElementById('modalTitle').innerText = isLoginMode ? "Вход" : "Регистрация";
        document.getElementById('modalActionBtn').innerText = isLoginMode ? "Войти" : "Зарегистрироваться";
        document.getElementById('authLoginInput').style.display = isLoginMode ? "block" : "none";
        document.getElementById('usernameField').style.display = isLoginMode ? "none" : "block";
        document.getElementById('emailField').style.display = isLoginMode ? "none" : "block";
        document.getElementById('modalSwitchText').innerHTML = isLoginMode ? 'Нет аккаунта? <span onclick="toggleAuthMode()" style="color:var(--accent);">Зарегистрироваться</span>' : 'Уже есть аккаунт? <span onclick="toggleAuthMode()" style="color:var(--accent);">Войти</span>';
    }

    async function submitAuth() {
        const password = document.getElementById('authPassword').value;
        const url = isLoginMode ? '/api/login' : '/api/register';
        const body = isLoginMode 
            ? { login: document.getElementById('authLoginInput').value, password } 
            : { username: document.getElementById('authUsername').value, email: document.getElementById('authEmail').value, password };

        if (!isLoginMode && document.getElementById('authUsername').value.length < 5) return alert("Юзернейм должен быть не менее 5 символов!");

        const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (data.success) {
            localStorage.setItem('user', JSON.stringify(data));
            alert("Успешно!");
            location.reload();
        } else {
            alert(data.error);
        }
    }

    function searchSite() {
        const query = document.getElementById('searchInput').value.trim();
        if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
    }

    async function checkAuthUserPanel() {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return;

        const res = await fetch(`/api/user/${encodeURIComponent(user.username)}`);
        const userData = res.ok ? await res.json() : { notifications: [], role: 'user', avatarUrl: '' };
        
        user.role = userData.role;
        user.avatarUrl = userData.avatarUrl;
        localStorage.setItem('user', JSON.stringify(user));

        const unreadCount = userData.notifications ? userData.notifications.length : 0;
        let notifHtml = '';
        if (unreadCount > 0) {
            userData.notifications.forEach(n => {
                notifHtml += `<div class="notif-item">🔔 ${n.text} <span style="color:var(--text-secondary); font-size:10px;">(${n.time})</span></div>`;
            });
            notifHtml += `<button onclick="clearNotifications()" class="btn" style="margin-top:8px; padding:4px; font-size:11px;">Очистить</button>`;
        } else {
            notifHtml = `<div style="font-size:12px; color:var(--text-secondary); text-align:center;">Нет новых уведомлений</div>`;
        }

        let avatarHtml = userData.avatarUrl 
            ? `<img src="${userData.avatarUrl}" style="width:30px; height:30px; border-radius:50%; object-fit:cover; border:1px solid var(--accent); vertical-align:middle;">`
            : `<span style="font-size:20px; vertical-align:middle;">👤</span>`;

        const authPanel = document.getElementById('authPanel');
        if(authPanel) {
            authPanel.innerHTML = `
                <div style="position:relative; display:inline-block; margin-right: 8px;">
                    <span onclick="toggleNotifMenu()" style="cursor:pointer; font-size:16px;" title="Уведомления">🔔<span id="notifBadge" style="background:#f85149; color:white; border-radius:50%; padding:1px 5px; font-size:10px; position:absolute; top:-5px; right:-10px; display:${unreadCount>0?'inline':'none'}">${unreadCount}</span></span>
                    <div id="notifDropdown" class="notif-dropdown">${notifHtml}</div>
                </div>
                <a href="profile.html?user=${encodeURIComponent(user.username)}" style="text-decoration:none;" title="Профиль">${avatarHtml}</a>
                <button onclick="localStorage.removeItem('user'); location.reload();" style="background:#f85149; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; margin-left:8px; font-size:12px;">Выйти</button>
            `;
        }
        document.getElementById('uploadSection').style.display = 'block';
        document.getElementById('loginPrompt').style.display = 'none';
    }

    function toggleNotifMenu() {
        const drop = document.getElementById('notifDropdown');
        drop.style.display = drop.style.display === 'block' ? 'none' : 'block';
    }

    async function clearNotifications() {
        const user = JSON.parse(localStorage.getItem('user'));
        await fetch('/api/user/notifications/clear', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username })
        });
        location.reload();
    }

    function showToast() {
        const toast = document.getElementById("toast");
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function uploadPost() {
        const user = JSON.parse(localStorage.getItem('user'));
        const fileInput = document.getElementById('imageFile');
        const caption = document.getElementById('imageCaption').value;
        const category = document.getElementById('imageCategory').value;
        if (!fileInput.files[0]) return alert("Выберите картинку!");

        const formData = new FormData();
        formData.append('image', fileInput.files[0]);
        formData.append('caption', caption);
        formData.append('category', category);
        formData.append('username', user.username);

        document.getElementById('progressContainer').style.display = 'block';
        document.getElementById('publishBtn').style.display = 'none';

        currentXHR = new XMLHttpRequest();
        currentXHR.open('POST', '/api/posts', true);

        currentXHR.upload.onprogress = function(e) {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                document.getElementById('progressBarFill').style.width = percent + '%';
                document.getElementById('progressText').innerText = `Загрузка: ${percent}%`;
            }
        };

        currentXHR.onload = function() {
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('publishBtn').style.display = 'block';
            if (currentXHR.status === 200) {
                alert("Пост опубликован!");
                fileInput.value = '';
                document.getElementById('imageCaption').value = '';
                loadPosts();
            } else {
                alert("Ошибка загрузки");
            }
            currentXHR = null;
        };
        currentXHR.send(formData);
    }

    function cancelUpload() {
        if (currentXHR) {
            currentXHR.abort();
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('publishBtn').style.display = 'block';
            alert("Загрузка отменена.");
        }
    }

    async function deletePost(postId) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!confirm("Удалить эту фотографию?")) return;
        const res = await fetch(`/api/posts/${postId}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username })
        });
        const data = await res.json();
        if (data.success) loadPosts();
        else alert(data.error);
    }

    async function toggleLike(postId, author) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return openAuthModal(true);
        if (author === user.username) showToast();

        const res = await fetch(`/api/posts/${postId}/like`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username })
        });
        const data = await res.json();
        if (data.success) loadPosts();
    }

    async function addComment(postId) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return openAuthModal(true);
        const input = document.getElementById(`commentInput_${postId}`);
        const text = input.value;
        if (!text.trim()) return;

        const res = await fetch(`/api/posts/${postId}/comment`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username, text })
        });
        const data = await res.json();
        if (data.success) {
            input.value = '';
            loadPosts();
        }
    }

    function showReplyInput(postId, commentId) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) return openAuthModal(true);
        const box = document.getElementById(`replyBox_${postId}_${commentId}`);
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function sendReply(postId, commentId) {
        const user = JSON.parse(localStorage.getItem('user'));
        const input = document.getElementById(`replyInput_${postId}_${commentId}`);
        const text = input.value;
        if (!text.trim()) return;

        const res = await fetch(`/api/posts/${postId}/comment/${commentId}/reply`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username, text })
        });
        const data = await res.json();
        if (data.success) loadPosts();
    }

    async function deleteComment(postId, commentId, isReply = false, parentId = null) {
        const user = JSON.parse(localStorage.getItem('user'));
        if (!confirm("Удалить этот комментарий?")) return;
        const res = await fetch(`/api/posts/${postId}/comment/${commentId}`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user.username, isReply, parentId })
        });
        const data = await res.json();
        if (data.success) loadPosts();
        else alert(data.error);
    }

    async function loadPosts() {
        const user = JSON.parse(localStorage.getItem('user'));
        const filterCategory = document.getElementById('categoryFilter').value;
        const feed = document.getElementById('postsFeed');
        const res = await fetch('/api/posts');
        const posts = await res.json();
        
        const filteredPosts = posts.filter(p => filterCategory === 'all' || p.category === filterCategory);

        if (filteredPosts.length === 0) {
            feed.innerHTML = "<p style='color:var(--text-secondary); text-align:center;'>В этой категории пока нет скриншотов.</p>";
            return;
        }

        feed.innerHTML = "";
        filteredPosts.forEach(post => {
            const likesCount = post.likes ? post.likes.length : 0;
            const isLiked = user && post.likes && post.likes.includes(user.username);
            const likeColor = isLiked ? '#f85149' : 'var(--text-secondary)';

            const canDeletePost = user && (user.username === post.author || user.role === 'admin' || user.role === 'moderator');
            let deletePostBtn = canDeletePost ? `<button onclick="deletePost(${post.id})" style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:13px; font-weight:600; float:right;">🗑️ Удалить фото</button>` : '';

            let commentsHtml = '';
            if (post.comments) {
                post.comments.forEach(c => {
                    const canDeleteComment = user && (user.username === c.author || user.role === 'admin' || user.role === 'moderator');
                    let deleteBtn = canDeleteComment ? `<span class="delete-text" onclick="deleteComment(${post.id}, ${c.id})">🗑️ Удалить</span>` : '';
                    let replyBtn = user ? `<span onclick="showReplyInput(${post.id}, ${c.id})">💬 Ответить</span>` : '';

                    let repliesHtml = '';
                    if (c.replies) {
                        c.replies.forEach(r => {
                            const canDeleteReply = user && (user.username === r.author || user.role === 'admin' || user.role === 'moderator');
                            let deleteReplyBtn = canDeleteReply ? `<span class="delete-text" onclick="deleteComment(${post.id}, ${r.id}, true, ${c.id})">🗑️</span>` : '';
                            repliesHtml += `
                                <div class="reply-box">
                                    <a href="profile.html?user=${encodeURIComponent(r.author)}" style="color:var(--accent); text-decoration:none;"><b>${r.author}</b></a>: ${r.text}
                                    <div class="comment-actions">${deleteReplyBtn}</div>
                                </div>
                            `;
                        });
                    }

                    commentsHtml += `
                        <div class="comment-box">
                            <a href="profile.html?user=${encodeURIComponent(c.author)}" style="color:var(--accent); text-decoration:none;"><b>${c.author}</b></a>: ${c.text}
                            <div class="comment-actions">${replyBtn} ${deleteBtn}</div>
                            <div id="replyBox_${post.id}_${c.id}" style="display:none; margin-top:6px;">
                                <input type="text" id="replyInput_${post.id}_${c.id}" placeholder="Ваш ответ..." style="margin:0; padding:4px 8px; font-size:12px; width:80%;" onkeydown="if(event.key === 'Enter') sendReply(${post.id}, ${c.id})">
                                <button onclick="sendReply(${post.id}, ${c.id})" class="btn" style="width:auto; padding:4px 8px; font-size:12px;">Ок</button>
                            </div>
                            ${repliesHtml}
                        </div>
                    `;
                });
            }

            feed.innerHTML += `
                <div style="background:var(--box-bg); border-radius:8px; padding:15px; margin-bottom:20px; border:1px solid var(--border);">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
                        <p style="margin:0; font-size:13px;"><b>Автор:</b> <a href="profile.html?user=${encodeURIComponent(post.author)}" style="color:var(--accent); text-decoration:none;">${post.author}</a> <span style="background:var(--card-bg); padding:2px 6px; border-radius:4px; font-size:11px; color:var(--text-secondary); margin-left:8px;">📁 ${post.category || 'Разное'}</span></p>
                        ${deletePostBtn}
                    </div>
                    <p style="margin:0 0 10px 0;">${post.caption || ''}</p>
                    <img src="${post.imageUrl}" style="width:100%; border-radius:6px; max-height:400px; object-fit:cover;">
                    
                    <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
                        <button onclick="toggleLike(${post.id}, '${post.author}')" style="background:none; border:none; cursor:pointer; color:${likeColor}; font-size: 16px; display:flex; align-items:center; gap:5px;">
                            ❤️ <span>${likesCount}</span>
                        </button>
                    </div>

                    <div style="margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px;">
                        <div style="max-height: 180px; overflow-y: auto; margin-bottom: 8px;">${commentsHtml || '<span style="color:var(--text-secondary); font-size:12px;">Нет комментариев</span>'}</div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="commentInput_${post.id}" placeholder="Написать комментарий..." style="margin:0; padding:6px 10px; font-size:13px;" onkeydown="if(event.key === 'Enter') addComment(${post.id})">
                            <button onclick="addComment(${post.id})" class="btn" style="width: auto; padding: 6px 12px; font-size: 13px;">Отправить</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    checkAuthUserPanel();
    loadPosts();
</script>
</body>
</html>
